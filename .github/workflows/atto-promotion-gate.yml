name: AttoLang candidate aggregate gate
on:
  pull_request:
    paths:
      - 'docs/atto-candidate-promotion.v1.json'
      - 'scripts/test-atto-promotion.mjs'
      - '.gitmodules'
      - 'packages/act-clients'
      - 'packages/act-interfaces'
      - '.github/workflows/atto-promotion-gate.yml'
  push:
    branches: [main]
    paths:
      - 'docs/atto-candidate-promotion.v1.json'
      - 'scripts/test-atto-promotion.mjs'
      - '.gitmodules'
      - 'packages/act-clients'
      - 'packages/act-interfaces'
      - '.github/workflows/atto-promotion-gate.yml'
permissions:
  contents: read
jobs:
  atto-aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --test scripts/test-atto-promotion.mjs
